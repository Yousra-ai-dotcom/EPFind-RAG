name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epfind
          POSTGRES_PASSWORD: epfind_test
          POSTGRES_DB: epf_find
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U epfind -d epf_find"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r ingestion/requirements.txt -r generation/requirements.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://epfind:epfind_test@localhost:5432/epf_find
        run: pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build